<form class="recipe-form" [formGroup]="form" (ngSubmit)="submit()">
  <h1>{{ isEditMode ? 'Edit recipe' : 'New recipe' }}</h1>

  <mat-form-field appearance="outline" class="recipe-form__field">
    <mat-label>Title</mat-label>
    <input matInput formControlName="title" required dir="auto" />
  </mat-form-field>

  <app-label-autocomplete
    [allLabels]="allLabels()"
    [selected]="selectedLabels()"
    (selectedChange)="onSelectedLabelsChange($event)"
    (createLabel)="onCreateLabel($event)"
  />

  <app-image-upload
    [existingImageUrl]="existingImageUrl()"
    (fileSelected)="onImageSelected($event)"
    (cleared)="onImageCleared()"
  />

  <div class="recipe-form__ingredients" formArrayName="ingredients">
    <h2>Ingredients</h2>
    @for (group of ingredientsArray.controls; track $index) {
      <div class="recipe-form__ingredient-row" [formGroupName]="$index">
        <mat-form-field appearance="outline" class="recipe-form__quantity">
          <mat-label>Qty</mat-label>
          <input matInput formControlName="quantity" dir="auto" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="recipe-form__ingredient-name">
          <mat-label>Ingredient</mat-label>
          <input matInput formControlName="name" required dir="auto" />
        </mat-form-field>
        <button
          mat-icon-button
          type="button"
          (click)="removeIngredient($index)"
          [disabled]="ingredientsArray.length === 1"
          aria-label="Remove ingredient"
        >
          <mat-icon>remove_circle_outline</mat-icon>
        </button>
      </div>
    }
    <button mat-button type="button" (click)="addIngredient()">
      <mat-icon>add</mat-icon>
      Add ingredient
    </button>
  </div>

  <mat-form-field appearance="outline" class="recipe-form__field">
    <mat-label>Instructions</mat-label>
    <textarea matInput formControlName="instructions" rows="8" required dir="auto"></textarea>
  </mat-form-field>

  <div class="recipe-form__actions">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
      {{ isEditMode ? 'Save changes' : 'Create recipe' }}
    </button>
  </div>
</form>
