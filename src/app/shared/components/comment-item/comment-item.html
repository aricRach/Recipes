<div class="comment-item">
  <div class="comment-item__header">
    <span class="comment-item__author">{{ comment().userName }}</span>
    <span class="comment-item__time">{{ comment().createdAt | timeAgo }}</span>
    @if (canDelete) {
      <button mat-icon-button (click)="deleteComment.emit(comment().id)" aria-label="Delete comment">
        <mat-icon>delete</mat-icon>
      </button>
    }
  </div>
  <p class="comment-item__text">{{ comment().text }}</p>
</div>
